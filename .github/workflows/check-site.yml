name: Check site
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check static pages and links
        run: python3 scripts/check_site.py
      - name: Check JavaScript syntax and failure handling
        run: |
          node --check scripts.js
          node --test tests/chrome.test.cjs
