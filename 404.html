<!doctype html>

<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#181825" />

    <!--Theme: set before first paint to avoid a flash-->
    <script>
      // Theme bootstrap: inline on purpose (an external file would block first paint).
      // Identical copies: index.html, about/index.html, experience/index.html,
      // projects/index.html, 404.html. scripts.js shares the "theme" key and the
      // "light"/"dark" values. Change one, change them all.
      (function () {
        var t;
        try {
          t = localStorage.getItem("theme");
        } catch (e) {}
        if (t !== "light" && t !== "dark")
          t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", t);
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", t === "light" ? "#e6e9ef" : "#181825");
      })();
    </script>

    <!--Google Fonts: JetBrains Mono & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <!--Preload shared partials (crossorigin matches fetch()'s default cors mode)-->
    <link rel="preload" href="/_includes/_nav.html" as="fetch" crossorigin />
    <link rel="preload" href="/_includes/_sidebars.html" as="fetch" crossorigin />
    <link rel="preload" href="/_includes/_footer-modal.html" as="fetch" crossorigin />
    <!--Bootstrap CSS-->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!--Bootstrap JS-->
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <!--Custom CSS-->
    <link href="/styles.css" rel="stylesheet" />
    <!--Custom JS-->
    <script defer src="/scripts.js"></script>
    <!--Website Title & Logo-->
    <title>404 | Ahmad Mollaei</title>
    <link rel="icon" type="image/png" href="/assets/images/logo_tab.png" />
  </head>

  <body class="d-flex flex-column min-vh-100 m-0">
    <a class="visually-hidden-focusable skip-link" href="#main"
      >Skip to content</a
    >

    <!--Header-->
    <header id="site-header">
      <!--Without JS the navbar partial never loads; keep the site navigable-->
      <noscript>
        <nav class="container d-flex flex-wrap gap-4 py-3 font-monospace" aria-label="Main">
          <a href="/">Home</a>
          <a href="/about/">About</a>
          <a href="/experience/">Experience</a>
          <a href="/projects/">Projects</a>
        </nav>
      </noscript>
    </header>

    <!--Fixed SideBars-->
    <div id="site-sidebars"></div>

    <!--Main-->
    <main id="main" class="flex-grow-1">
      <section
        class="hero-section container d-flex flex-column justify-content-center align-items-start"
      >
        <!--Error Code-->
        <p class="font-monospace mb-2 not-found-label">
          <span class="not-found-accent">></span> ERROR
        </p>

        <!-- 404-->
        <h1 class="display-1 fw-bold font-monospace mb-3 not-found-code">
          404
        </h1>

        <!-- Tagline -->
        <h2 class="fw-bold mb-3 not-found-heading">Page not found.</h2>

        <!-- Message -->
        <p class="mb-5 not-found-desc" style="max-width: 480px">
          Even my multi-agent system couldn't locate this one. The page you're
          looking for doesn't exist, was moved, or never made it past the strict
          protocol loop.
        </p>

        <!-- Suggestion block -->
        <div class="font-monospace not-found-terminal mb-5 p-4">
          <p class="mb-1 not-found-comment"># suggestion fix:</p>
          <p class="mb-0">
            <span class="not-found-accent">$</span>
            <a href="/" class="not-found-cmd ms-1">cd ~/home</a
            ><span class="not-found-cursor" aria-hidden="true"></span>
          </p>
        </div>

        <!-- Back button-->
        <a class="btn btn-resume btn-lg font-monospace px-4 py-3" href="/">
          Back to Home
        </a>
      </section>
    </main>

    <!--Footer-->
    <div id="site-chrome-bottom"></div>
  </body>
</html>
